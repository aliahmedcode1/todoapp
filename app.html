<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --surface: #111111;
            --surface-2: #1a1a1a;
            --border: #222222;
            --border-focus: #555555;
            --ink: #ffffff;
            --ink-soft: #888888;
            --ink-mute: #555555;
            --btn-bg: #ffffff;
            --btn-fg: #000000;
            --btn-hover: #dddddd;
            --error: #ff4444;
            --success: #44ff44;
            --radius: 12px;
            --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-font-smoothing: antialiased; }

        body {
            min-height: 100vh;
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--ink);
            background: var(--bg);
            padding: 1.25rem;
        }

        .app {
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            animation: rise 0.5s var(--ease) both;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .mark {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: var(--ink);
            display: grid; place-items: center; flex: none;
        }

        .mark svg { width: 18px; height: 18px; stroke: var(--bg); stroke-width: 2.5; }

        .brand-text h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1;
        }

        .brand-text p { color: var(--ink-soft); font-size: 0.75rem; margin-top: 0.1rem; }

        .header-right {
            display: flex; align-items: center; gap: 0.75rem;
        }

        .user-email {
            font-size: 0.78rem; color: var(--ink-soft); max-width: 160px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .icon-btn {
            width: 36px; height: 36px;
            border: 1px solid var(--border); border-radius: 8px;
            background: transparent; color: var(--ink-soft);
            cursor: pointer; display: grid; place-items: center;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        .icon-btn:hover { background: rgba(255,255,255,0.05); color: var(--ink); border-color: var(--border-focus); }
        .icon-btn svg { width: 16px; height: 16px; }

        /* Add form */
        .glass {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .add-section { padding: 1.25rem; display: flex; flex-direction: column; gap: 0.75rem; }

        .add-row { display: flex; gap: 0.5rem; }

        .add-section input {
            flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
            color: var(--ink); font-family: inherit; font-size: 0.9rem; padding: 0.7rem 0.85rem;
            transition: border-color 0.2s var(--ease);
        }

        .add-section input::placeholder { color: var(--ink-mute); }
        .add-section input:focus { outline: none; border-color: var(--border-focus); }

        .add-btn {
            padding: 0.7rem 1.25rem; border: none; border-radius: 8px;
            background: var(--btn-bg); color: var(--btn-fg);
            font-family: inherit; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; white-space: nowrap;
            transition: background 0.2s var(--ease), transform 0.1s;
        }

        .add-btn:hover { background: var(--btn-hover); }
        .add-btn:active { transform: scale(0.97); }

        /* Search & toolbar */
        .toolbar {
            display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
        }

        .search-wrap {
            flex: 1; min-width: 160px; position: relative;
        }

        .search-wrap svg {
            position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%);
            width: 15px; height: 15px; color: var(--ink-mute); pointer-events: none;
        }

        .search-wrap input {
            width: 100%; background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; color: var(--ink); font-family: inherit; font-size: 0.85rem;
            padding: 0.6rem 0.75rem 0.6rem 2.25rem;
            transition: border-color 0.2s var(--ease);
        }

        .search-wrap input::placeholder { color: var(--ink-mute); }
        .search-wrap input:focus { outline: none; border-color: var(--border-focus); }

        .counts {
            font-size: 0.78rem; color: var(--ink-mute); white-space: nowrap;
        }

        .counts span { color: var(--ink-soft); font-weight: 600; }

        /* Filters */
        .filters {
            display: flex; gap: 0.35rem;
        }

        .filter {
            padding: 0.4rem 0.85rem; border: 1px solid var(--border); border-radius: 20px;
            background: transparent; color: var(--ink-soft); font-family: inherit;
            font-size: 0.78rem; font-weight: 500; cursor: pointer;
            transition: all 0.2s var(--ease);
        }

        .filter:hover { border-color: var(--border-focus); color: var(--ink); }

        .filter.is-active {
            background: var(--ink); color: var(--btn-fg); border-color: var(--ink);
        }

        .clear-done {
            margin-left: auto; padding: 0.4rem 0.75rem; border: none; border-radius: 20px;
            background: transparent; color: var(--ink-mute); font-family: inherit;
            font-size: 0.75rem; font-weight: 500; cursor: pointer;
            transition: color 0.2s;
        }

        .clear-done:hover { color: var(--error); }

        /* Task list */
        .task-list {
            list-style: none; display: flex; flex-direction: column; gap: 0.5rem;
        }

        .task {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.85rem 1rem; transition: opacity 0.25s, transform 0.25s;
        }

        .task.leaving {
            opacity: 0; transform: translateX(20px);
        }

        .check {
            width: 22px; height: 22px; border-radius: 6px;
            border: 1.5px solid var(--border); background: transparent;
            cursor: pointer; display: grid; place-items: center; flex: none;
            transition: all 0.2s var(--ease);
        }

        .check svg { width: 13px; height: 13px; stroke: transparent; stroke-width: 2.5; transition: stroke 0.2s; }
        .check:hover { border-color: var(--border-focus); }
        .completed .check { background: var(--ink); border-color: var(--ink); }
        .completed .check svg { stroke: var(--bg); }

        .body {
            flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.15rem;
        }

        .title {
            font-size: 0.9rem; font-weight: 500; word-break: break-word;
            transition: color 0.2s;
        }

        .completed .title { color: var(--ink-mute); text-decoration: line-through; }

        .detail {
            font-size: 0.78rem; color: var(--ink-soft); word-break: break-word;
        }

        .completed .detail { color: var(--ink-mute); }

        .actions {
            display: flex; gap: 0.25rem; opacity: 0; transform: translateX(6px);
            transition: opacity 0.2s, transform 0.2s;
        }

        .task:hover .actions { opacity: 1; transform: none; }

        .actions .icon-btn.danger:hover { color: var(--error); border-color: var(--error); }

        /* Inline edit */
        .edit-field {
            width: 100%; background: var(--bg); border: 1px solid var(--border);
            border-radius: 6px; color: var(--ink); font-family: inherit;
            font-size: 0.9rem; padding: 0.5rem 0.65rem;
            transition: border-color 0.2s var(--ease);
        }

        .edit-field.detail-edit { font-size: 0.8rem; margin-top: 0.35rem; }
        .edit-field::placeholder { color: var(--ink-mute); }
        .edit-field:focus { outline: none; border-color: var(--border-focus); }

        /* Empty state */
        .empty {
            text-align: center; padding: 3rem 1rem; color: var(--ink-mute);
        }

        .empty h3 {
            font-family: 'Space Grotesk', sans-serif; font-size: 1.1rem;
            color: var(--ink-soft); margin-bottom: 0.35rem;
        }

        .empty p { font-size: 0.85rem; }

        /* Loading */
        .loading {
            text-align: center; padding: 3rem 1rem; color: var(--ink-mute); font-size: 0.85rem;
        }

        /* Pagination */
        .pager {
            display: flex; align-items: center; justify-content: center;
            gap: 0.75rem; padding: 0.5rem 0;
        }

        .pager button {
            padding: 0.35rem 0.75rem; border: 1px solid var(--border); border-radius: 6px;
            background: transparent; color: var(--ink-soft); font-family: inherit;
            font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
        }

        .pager button:hover:not(:disabled) { border-color: var(--border-focus); color: var(--ink); }
        .pager button:disabled { opacity: 0.3; cursor: not-allowed; }
        .pager span { font-size: 0.78rem; color: var(--ink-mute); }

        /* Toasts */
        .toasts {
            position: fixed; bottom: 1.5rem; right: 1.5rem;
            display: flex; flex-direction: column; gap: 0.5rem; z-index: 100;
        }

        .toast {
            padding: 0.65rem 1rem; border-radius: 8px;
            background: var(--surface-2); border: 1px solid var(--border);
            color: var(--ink-soft); font-size: 0.82rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .toast.error { border-color: var(--error); color: var(--error); }

        @keyframes rise {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: none; }
        }

        @media (max-width: 480px) {
            .header { flex-wrap: wrap; gap: 0.5rem; }
            .user-email { display: none; }
            .toolbar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <span class="mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 13a8 8 0 0 1 16 0" />
                        <path d="M12 5v-1M4.2 13H3M21 13h-1.2M6.3 7.3l-.8-.8M17.7 7.3l.8-.8" />
                        <path d="M9 17l2 2 4-4" />
                    </svg>
                </span>
                <div class="brand-text">
                    <h1>Taskly</h1>
                    <p id="user-email"></p>
                </div>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="logout-btn" aria-label="Log out" title="Log out">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </header>

        <section class="glass add-section">
            <form id="add-form" class="add-row">
                <input id="task-title" type="text" placeholder="What needs to be done?" maxlength="160" required>
                <input id="task-detail" type="text" placeholder="Detail (optional)" maxlength="240" style="max-width:180px">
                <button class="add-btn" type="submit">Add</button>
            </form>
        </section>

        <div class="toolbar">
            <div class="search-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input id="search-input" type="text" placeholder="Search tasks...">
            </div>
            <span class="counts"><span id="count-active">0</span> active &middot; <span id="count-done">0</span> done</span>
        </div>

        <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap">
            <div class="filters">
                <button class="filter is-active" data-filter="all">All</button>
                <button class="filter" data-filter="active">Active</button>
                <button class="filter" data-filter="done">Done</button>
            </div>
            <button class="clear-done" id="clear-done" hidden>Clear done</button>
        </div>

        <div id="loading" class="loading">Loading tasks...</div>

        <ul class="task-list" id="todo-list"></ul>

        <div class="empty" id="empty-state" hidden>
            <h3 id="empty-title">All clear</h3>
            <p id="empty-text">Add your first task above.</p>
        </div>

        <div class="pager" id="pager" hidden>
            <button id="page-prev">Prev</button>
            <span id="page-info">Page 1 of 1</span>
            <button id="page-next">Next</button>
        </div>
    </div>

    <div class="toasts" id="toasts"></div>

    <script type="module" src="crud.js"></script>
</body>

</html>
